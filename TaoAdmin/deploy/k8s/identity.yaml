apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: taoadmin
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity }
  template:
    metadata:
      labels: { app: identity }
    spec:
      containers:
        - name: identity
          image: registry.example.com/taoadmin/identity:latest
          ports: [{ containerPort: 5001 }]
          envFrom:
            - configMapRef: { name: taoadmin-config }
            - secretRef: { name: taoadmin-secret }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: taoadmin
spec:
  selector: { app: identity }
  ports: [{ port: 5001, targetPort: 5001 }]
