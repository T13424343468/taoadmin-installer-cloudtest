name: installer-cloudtest
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  native-route:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Assert disk space
        shell: pwsh
        run: |
          $d = Get-PSDrive D
          $free = [int]($d.Free/1GB)
          Write-Host "D: free $free GB"
          if ($free -lt 8) { throw "disk free under 8GB: $free" }
      - name: Stop preinstalled MySQL
        shell: pwsh
        run: |
          Get-Service | Where-Object { $_.Name -like 'MySQL*' } | ForEach-Object {
            Write-Host "stopping $($_.Name)"
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
          }
      - name: Run installer (native route, real run)
        shell: pwsh
        run: ./TaoAdmin/deploy/windows/install-windows.ps1 -Action install -Route native -Force
      - name: Status after install
        if: always()
        shell: pwsh
        run: ./TaoAdmin/deploy/windows/install-windows.ps1 -Action status
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: TaoAdmin/deploy/windows/runtime/logs/

  container-route:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Baseline docker works
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            docker info 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "docker engine not ready, retry $i"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw 'docker engine not ready after 2 minutes' }
      - name: Uninstall Docker Desktop (exercise auto-install branch)
        shell: pwsh
        run: |
          # 1) 注册表卸载入口：winget 对非 winget 装的包会报 No installed package found
          $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $un = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like '*Docker*' -and $_.UninstallString }
          foreach ($u in $un) {
            Write-Host "registry uninstall entry: $($u.DisplayName) -> $($u.UninstallString)"
            try { cmd /c "$($u.UninstallString) /S" 2>$null } catch {}
          }
          Start-Sleep -Seconds 15
          # 1.5) 停掉预装 docker 服务，避免旧引擎干扰新装 Docker Desktop 的引擎切换
          Get-Service | Where-Object { $_.Name -like '*docker*' } | ForEach-Object {
            Write-Host "stopping service $($_.Name)"
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
          }
          # 2) 仍存在则掩蔽：runner 把 docker.exe 直接放在 system32，PATH 掩蔽藏不住，
          #    挪走 CLI（dockerd 若被服务占用则跳过），让安装器真实走自动安装分支
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            $dc = Get-Command docker
            Write-Host "docker resolves to: $($dc.Source)"
            foreach ($f in @("$env:windir\system32\docker.exe","$env:windir\system32\dockerd.exe")) {
              if (Test-Path -LiteralPath $f) {
                try { Move-Item -LiteralPath $f -Destination "$f.masked" -Force; Write-Host "moved $f" } catch { Write-Host "move failed for $f : $_" }
              }
            }
            # 再从机器与当前 PATH 移除 docker 相关目录（双保险）
            $dirsToRemove = @()
            if ($dc.Source) { $dirsToRemove += (Split-Path $dc.Source).TrimEnd('\') }
            $dirsToRemove += @('C:\Program Files\Docker\Docker\resources\bin','C:\ProgramData\DockerDesktop')
            $filter = {
              param($entry)
              $p = ([string]$entry).TrimEnd('\')
              if (-not $p) { return $false }
              if ($dirsToRemove -contains $p) { return $false }
              if ($entry -like '*\Docker*' -or $entry -like '*\docker*') { return $false }
              return $true
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path','Machine')
            $cleaned = ($machinePath -split ';' | Where-Object $filter) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $cleaned, 'Machine')
            $env:PATH = ($env:PATH -split ';' | Where-Object $filter) -join ';'
            if (Get-Command docker -ErrorAction SilentlyContinue) {
              $dc2 = Get-Command docker
              throw "docker still reachable after masking at: $($dc2.Source)"
            }
            Write-Host 'docker masked — installer will exercise auto-install branch'
          } else {
            Write-Host 'docker removed — installer auto-install branch will be exercised for real'
          }
      - name: Run installer (container route, real run)
        shell: pwsh
        run: ./TaoAdmin/deploy/windows/install-windows.ps1 -Action install -Route docker -Force
      - name: Verify endpoints (gateway / taofiles / frontend)
        shell: pwsh
        run: |
          foreach ($u in 'http://127.0.0.1:5000/health','http://127.0.0.1:5003/health','http://127.0.0.1:8080/') {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $r = Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -lt 500) { $ok = $true; break } } catch {}
              Start-Sleep -Seconds 4
            }
            if (-not $ok) { throw "endpoint not ready: $u" }
            Write-Host "OK $u"
          }
      - name: Collect compose state
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Docker\Docker\resources\bin;$env:PATH"
          cd TaoAdmin/deploy
          docker compose logs --no-color > $env:GITHUB_WORKSPACE\compose-logs.txt 2>&1
          docker ps -a > $env:GITHUB_WORKSPACE\docker-ps.txt 2>&1
          docker compose down -v 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\compose-down.txt
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-route-logs
          path: |
            compose-logs.txt
            docker-ps.txt
            compose-down.txt

  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Purge preinstalled databases (exercise real fresh-install path)
        run: |
          sudo apt-get purge -y 'mysql-server*' 'mysql-client*' 'mariadb-server*' 'mariadb-client*' 2>/dev/null || true
          sudo rm -rf /var/lib/mysql /var/log/mysql
          echo "purged; remaining:"; dpkg -l 2>/dev/null | grep -iE 'mysql|mariadb' || echo "  none"
      - name: Run installer (Linux native, real run)
        run: |
          cd TaoAdmin/deploy/oneclick
          AUTO_DEPS=1 ./install.sh --route native --force
      - name: Verify endpoints (4 services + frontend)
        run: |
          for u in http://127.0.0.1:5000/health http://127.0.0.1:5001/health http://127.0.0.1:5002/health http://127.0.0.1:5003/health http://127.0.0.1:8080/; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$u" || true)
              if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=1; break; fi
              sleep 4
            done
            if [ "$ok" != "1" ]; then echo "endpoint not ready: $u"; exit 1; fi
            echo "OK $u"
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-logs
          path: |
            /var/tmp/taoadmin-deploy.log
            /var/tmp/taoadmin-dotnet-install.log
            /var/tmp/taoadmin-apt.log
            TaoAdmin/deploy/run/
