apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taoadmin-ingress
  namespace: taoadmin
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: admin.example.com          # TODO: 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 5000 }
