name: deployer-cloudtest
on:
  push:
    branches: [ main ]
    paths:
      - 'TaoAdmin/deploy/windows/TaoAdminDeployer/**'
      - 'TaoAdmin/deploy/windows/verify-functions.ps1'
      - '.github/workflows/deployer-cloudtest.yml'
  workflow_dispatch: {}

jobs:
  deployer-build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build core + app (0 error 0 warning gate)
        shell: pwsh
        run: |
          dotnet build TaoAdmin/deploy/windows/TaoAdminDeployer/src/Deployer.Core/Deployer.Core.csproj -v q --nologo
          if ($LASTEXITCODE -ne 0) { throw 'core build failed' }
          dotnet build TaoAdmin/deploy/windows/TaoAdminDeployer/src/Deployer.App/Deployer.App.csproj -v q --nologo
          if ($LASTEXITCODE -ne 0) { throw 'app build failed' }
      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test TaoAdmin/deploy/windows/TaoAdminDeployer/tests/Deployer.Core.Tests/Deployer.Core.Tests.csproj --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }
      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          # Publish OUTSIDE the repo tree: -o pointing at (or above) the project dir makes
          # the SDK add PublishDir/** to DefaultItemExcludes, which silently excludes ALL
          # source files and produces an empty assembly. Runner temp is always safe.
          $out = "$env:RUNNER_TEMP/deployer-out"
          dotnet publish TaoAdmin/deploy/windows/TaoAdminDeployer/src/Deployer.App/Deployer.App.csproj -c Release -o $out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          Copy-Item "$out/TaoAdminDeployer.exe" TaoAdmin/deploy/windows/ -Force
          Copy-Item "$out/TaoAdminDeployer.pdb" TaoAdmin/deploy/windows/ -Force -ErrorAction SilentlyContinue
          $exe = 'TaoAdmin/deploy/windows/TaoAdminDeployer.exe'
          if (-not (Test-Path $exe)) { throw 'published exe missing' }
          $mb = [int]((Get-Item $exe).Length / 1MB)
          Write-Host "published exe size: $mb MB"
          if ($mb -lt 20) { throw "published exe suspiciously small: $mb MB" }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployer-exe
          path: TaoAdmin/deploy/windows/TaoAdminDeployer.exe

  deployer-e2e-container:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Uninstall Docker Desktop (exercise auto-install branch)
        shell: pwsh
        run: |
          # 1) registry uninstall entry: winget rejects non-winget packages
          $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $un = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like '*Docker*' -and $_.UninstallString }
          foreach ($u in $un) {
            Write-Host "registry uninstall entry: $($u.DisplayName) -> $($u.UninstallString)"
            try { cmd /c "$($u.UninstallString) /S" 2>$null } catch {}
          }
          Start-Sleep -Seconds 15
          # 1.5) stop preinstalled docker services so the old engine cannot fight the fresh one
          Get-Service | Where-Object { $_.Name -like '*docker*' } | ForEach-Object {
            Write-Host "stopping service $($_.Name)"
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
          }
          # 2) mask leftovers: runner puts docker.exe straight into system32, PATH masking
          #    cannot hide it — move the CLI away so the deployer truly exercises auto-install
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            $dc = Get-Command docker
            Write-Host "docker resolves to: $($dc.Source)"
            foreach ($f in @("$env:windir\system32\docker.exe","$env:windir\system32\dockerd.exe")) {
              if (Test-Path -LiteralPath $f) {
                try { Move-Item -LiteralPath $f -Destination "$f.masked" -Force; Write-Host "moved $f" } catch { Write-Host "move failed for $f : $_" }
              }
            }
            $dirsToRemove = @()
            if ($dc.Source) { $dirsToRemove += (Split-Path $dc.Source).TrimEnd('\') }
            $dirsToRemove += @('C:\Program Files\Docker\Docker\resources\bin','C:\ProgramData\DockerDesktop')
            $filter = {
              param($entry)
              $p = ([string]$entry).TrimEnd('\')
              if (-not $p) { return $false }
              if ($dirsToRemove -contains $p) { return $false }
              if ($entry -like '*\Docker*' -or $entry -like '*\docker*') { return $false }
              return $true
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path','Machine')
            $cleaned = ($machinePath -split ';' | Where-Object $filter) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $cleaned, 'Machine')
            $env:PATH = ($env:PATH -split ';' | Where-Object $filter) -join ';'
            if (Get-Command docker -ErrorAction SilentlyContinue) {
              $dc2 = Get-Command docker
              throw "docker still reachable after masking at: $($dc2.Source)"
            }
            Write-Host 'docker masked — deployer will exercise auto-install branch'
          } else {
            Write-Host 'docker removed — deployer auto-install branch will be exercised for real'
          }
      - name: Publish deployer exe
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/deployer-out"
          dotnet publish TaoAdmin/deploy/windows/TaoAdminDeployer/src/Deployer.App/Deployer.App.csproj -c Release -o $out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          Copy-Item "$out/TaoAdminDeployer.exe" TaoAdmin/deploy/windows/ -Force
          Copy-Item "$out/TaoAdminDeployer.pdb" TaoAdmin/deploy/windows/ -Force -ErrorAction SilentlyContinue
      - name: E2E deploy (container route, real run via headless mode)
        timeout-minutes: 60
        shell: pwsh
        run: |
          $exe = 'TaoAdmin/deploy/windows/TaoAdminDeployer.exe'
          $hlog = 'TaoAdmin/deploy/windows/deployer-headless.log'
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--deploy','--route','docker','--yes' `
            -RedirectStandardOutput 'deployer-out.log' -RedirectStandardError 'deployer-err.log' `
            -PassThru
          $shown = 0
          while (-not $p.HasExited) {
            Start-Sleep -Seconds 20
            if (Test-Path $hlog) {
              $lines = @(Get-Content $hlog)
              if ($lines.Count -gt $shown) {
                $lines[$shown..($lines.Count - 1)] | ForEach-Object { Write-Host "  | $_" }
                $shown = $lines.Count
              }
            }
          }
          if (Test-Path $hlog) { @(Get-Content $hlog) | ForEach-Object { Write-Host "  | $_" } }
          Get-Content 'deployer-out.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $_" }
          Get-Content 'deployer-err.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ERR: $_" }
          if ($p.ExitCode -ne 0) { throw "deployer exit code $($p.ExitCode)" }
      - name: Verify functions (real login + business APIs + frontend)
        shell: pwsh
        run: |
          TaoAdmin/deploy/windows/verify-functions.ps1
      - name: Compose state and container logs after deploy
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          # Fresh Docker Desktop installs mid-job are not on the runner's fixed PATH.
          $docker = 'docker'
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $docker = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          }
          & $docker ps -a --format '{{.Names}} {{.Status}}' | ForEach-Object { Write-Host "  container: $_" }
          foreach ($c in 'taoadmin-identity','taoadmin-task','taoadmin-taofiles','taoadmin-gateway') {
            Write-Host "==== logs $c ===="
            & $docker logs --tail 80 $c 2>&1 | ForEach-Object { Write-Host "  $_" }
          }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployer-e2e-container-logs
          path: |
            deployer-out.log
            deployer-err.log
            TaoAdmin/deploy/windows/deployer-headless.log

  deployer-e2e-native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Stop preinstalled MySQL
        shell: pwsh
        run: |
          Get-Service | Where-Object { $_.Name -like 'MySQL*' } | ForEach-Object {
            Write-Host "stopping $($_.Name)"
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue
          }
      - name: Publish deployer exe
        shell: pwsh
        run: |
          # Same rule as build-test: never publish to a directory at/above the project dir.
          $out = "$env:RUNNER_TEMP/deployer-out"
          dotnet publish TaoAdmin/deploy/windows/TaoAdminDeployer/src/Deployer.App/Deployer.App.csproj -c Release -o $out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          Copy-Item "$out/TaoAdminDeployer.exe" TaoAdmin/deploy/windows/ -Force
          Copy-Item "$out/TaoAdminDeployer.pdb" TaoAdmin/deploy/windows/ -Force -ErrorAction SilentlyContinue
      - name: Smoke --status (startup + output channel check)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = 'TaoAdmin/deploy/windows/TaoAdminDeployer.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--status' `
            -RedirectStandardOutput 'status-out.log' -RedirectStandardError 'status-err.log' -PassThru
          $exited = $p.WaitForExit(120000)
          if (-not $exited) {
            Write-Host "!! --status alive after 2 min — capturing hang dump"
            $p.Refresh()
            Write-Host ("process: PID={0} Title='{1}' Responding={2}" -f $p.Id, $p.MainWindowTitle, $p.Responding)
            dotnet tool install -g dotnet-dump 2>&1 | Out-Null
            $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
            dotnet-dump collect -p $p.Id -o deployer-hang.dmp 2>&1 | ForEach-Object { Write-Host "  dump: $_" }
            if (Test-Path 'deployer-hang.dmp') {
              dotnet-dump analyze deployer-hang.dmp -c "clrstack -all" -c "exit" 2>&1 | Select-Object -First 200 | ForEach-Object { Write-Host "  stack: $_" }
            }
          }
          try {
            Get-Content 'status-out.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $_" }
            Get-Content 'status-err.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ERR: $_" }
            foreach ($f in 'TaoAdmin/deploy/windows/deployer-started.txt',"$env:TEMP\deployer-started.txt",'TaoAdmin/deploy/windows/deployer-headless.log') {
              if (Test-Path $f) { Write-Host "--- $f ---"; Get-Content $f | ForEach-Object { Write-Host "  | $_" } }
              else { Write-Host "missing: $f" }
            }
          } finally {
            if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'deployer --status did not exit within 2 minutes — startup hang' }
          }
          if ($p.ExitCode -ne 0) { throw "deployer --status exit code $($p.ExitCode)" }
          Write-Host 'status smoke OK'
      - name: E2E deploy (native route, real run via headless mode)
        timeout-minutes: 45
        shell: pwsh
        run: |
          $exe = 'TaoAdmin/deploy/windows/TaoAdminDeployer.exe'
          $hlog = 'TaoAdmin/deploy/windows/deployer-headless.log'
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--deploy','--route','native','--yes' `
            -RedirectStandardOutput 'deployer-out.log' -RedirectStandardError 'deployer-err.log' `
            -PassThru
          $shown = 0
          $start = Get-Date
          $dumped = $false
          while (-not $p.HasExited) {
            Start-Sleep -Seconds 15
            if (Test-Path $hlog) {
              $lines = @(Get-Content $hlog)
              if ($lines.Count -gt $shown) {
                $lines[$shown..($lines.Count - 1)] | ForEach-Object { Write-Host "  | $_" }
                $shown = $lines.Count
              }
            }
            if (-not $dumped -and ((Get-Date) - $start).TotalMinutes -ge 5) {
              $dumped = $true
              Write-Host "!! deployer alive 5 min without exiting — capturing diagnostics"
              $p.Refresh()
              Write-Host ("process: PID={0} Title='{1}' Responding={2}" -f $p.Id, $p.MainWindowTitle, $p.Responding)
              Get-Process TaoAdminDeployer -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host ("  window: '{0}' threads={1}" -f $_.MainWindowTitle, $_.Threads.Count)
              }
              dotnet tool install -g dotnet-dump --version 9.0.641601 2>&1 | Out-Null
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              dotnet-dump collect -p $p.Id -o deployer-hang.dmp 2>&1 | ForEach-Object { Write-Host "  dump: $_" }
              if (Test-Path 'deployer-hang.dmp') {
                dotnet-dump analyze deployer-hang.dmp -c "clrstack -all" "quit" 2>&1 | Select-Object -First 200 | ForEach-Object { Write-Host "  stack: $_" }
              }
            }
          }
          if (Test-Path $hlog) { @(Get-Content $hlog) | ForEach-Object { Write-Host "  | $_" } }
          Get-Content 'deployer-out.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $_" }
          Get-Content 'deployer-err.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ERR: $_" }
          if ($p.ExitCode -ne 0) { throw "deployer exit code $($p.ExitCode)" }
      - name: Verify endpoints (5 services)
        shell: pwsh
        run: |
          foreach ($u in 'http://127.0.0.1:5000/health','http://127.0.0.1:5001/health','http://127.0.0.1:5002/health','http://127.0.0.1:5003/health','http://127.0.0.1:8080/') {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $r = Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -lt 500) { $ok = $true; break } } catch {}
              Start-Sleep -Seconds 4
            }
            if (-not $ok) { throw "endpoint not ready: $u" }
            Write-Host "OK $u"
          }
      - name: Verify functions (real login + business APIs + frontend)
        shell: pwsh
        run: |
          TaoAdmin/deploy/windows/verify-functions.ps1
      - name: E2E uninstall (must be clean)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $exe = 'TaoAdmin/deploy/windows/TaoAdminDeployer.exe'
          $hlog = 'TaoAdmin/deploy/windows/deployer-headless.log'
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--uninstall','--yes' `
            -RedirectStandardOutput 'uninstall-out.log' -RedirectStandardError 'uninstall-err.log' `
            -PassThru
          $shown = 0
          while (-not $p.HasExited) {
            Start-Sleep -Seconds 10
            if (Test-Path $hlog) {
              $lines = @(Get-Content $hlog)
              if ($lines.Count -gt $shown) {
                $lines[$shown..($lines.Count - 1)] | ForEach-Object { Write-Host "  | $_" }
                $shown = $lines.Count
              }
            }
          }
          if (Test-Path $hlog) { @(Get-Content $hlog) | ForEach-Object { Write-Host "  | $_" } }
          Get-Content 'uninstall-out.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "OUT: $_" }
          Get-Content 'uninstall-err.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ERR: $_" }
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
      - name: Assert uninstall cleanliness (ports free, artifacts gone, source intact)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          foreach ($port in 5000,5001,5002,5003,8080,3306,6379) {
            $listening = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($listening) { throw "port $port still listening after uninstall" }
            Write-Host "port $port free"
          }
          foreach ($dir in 'TaoAdmin/deploy/publish','TaoAdmin/deploy/windows/runtime','TaoAdmin/frontend/node_modules','TaoAdmin/frontend/dist') {
            if (Test-Path $dir) { throw "artifact still present: $dir" }
            Write-Host "removed: $dir"
          }
          if (-not (Test-Path 'TaoAdmin/backend/src')) { throw 'source code must be kept' }
          if (-not (Test-Path 'TaoAdmin/deploy/sql/tao_admin_init.sql')) { throw 'source sql must be kept' }
          Write-Host 'uninstall cleanliness: PASS'
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployer-e2e-logs
          path: |
            deployer-out.log
            deployer-err.log
            status-out.log
            status-err.log
            deployer-hang.dmp
            TaoAdmin/deploy/windows/deployer-headless.log
            TaoAdmin/deploy/windows/deployer-started.txt
            TaoAdmin/deploy/windows/runtime/logs/
