apiVersion: v1
kind: Namespace
metadata:
  name: taoadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taoadmin-config
  namespace: taoadmin
data:
  NACOS_HOST: "nacos-headless.middleware:8848"
  REDIS_CONN: "redis-headless.middleware:6379"
  ES_URL: "http://elasticsearch.middleware:9200"
  MYSQL_CONN: "Server=mysql-headless.middleware;Port=3306;Database=tao_admin;User ID=root;Password=__MYSQL_PWD__;Character Set=utf8mb4;"
