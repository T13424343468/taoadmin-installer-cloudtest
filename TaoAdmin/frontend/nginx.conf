# ============================================================================
# TaoAdmin 前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
# 职责：托管前端静态文件 + /api 反向代理到网关 + SPA 路由回退
# 【本地】不用 Nginx，走 vite dev 的内置代理
# 【线上】docker compose 里的前端容器使用本文件
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩：js/css 传输体积减少 70% 左右
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # API 反向代理到后端网关
    # 【本地 compose 单机】proxy_pass http://gateway:5000;（服务名走容器网络）
    # 【线上分离部署】网关在别的机器时写 IP 或域名：
    #     proxy_pass http://10.0.1.100:5000;
    #     或配了域名：proxy_pass http://api.example.com;
    # 【线上 K8s】通常不用本文件做反代，由 Ingress 直接路由到网关 Service
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://gateway:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 静态资源缓存：带 hash 的文件名可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/system/user 这类前端路由刷新时返回 index.html 交给前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
