apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taoadmin
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: registry.example.com/taoadmin/gateway:latest
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: taoadmin-config }
            - secretRef: { name: taoadmin-secret }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: taoadmin
spec:
  selector: { app: gateway }
  ports: [{ port: 5000, targetPort: 5000 }]
